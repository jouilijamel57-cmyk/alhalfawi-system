<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>المنظومة الرقمية التفاعلية - مدرسة الحلفاوي</title>
    <style>
        body {
            font-family: 'Cairo', Tahoma, sans-serif;
            background-color: #f9f9f9;
            color: #333; /* لون الخط العام للصفحة ككل */
            padding: 20px;
        }
        
        .admin-panel {
            background: #fff;
            padding: 20px;
            margin-bottom: 20px;
            border: 2px dashed #007bff;
            border-radius: 8px;
        }

        /* باب المتابعة (القسم المستهدف لتغيير لون خطه فقط) */
        .followup-section {
            background: #fff;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
            color: #333; /* اللون الافتراضي لباب المتابعة */
        }

        table {
            width: 100%;
            text-align: right;
            border-collapse: collapse;
            font-size: 0.9rem;
            margin-top: 15px;
        }

        th, td {
            padding: 10px;
            border-bottom: 1px solid #e2e8f0;
        }

        th {
            background: #e2e8f0;
            color: #1e293b;
        }

        button {
            cursor: pointer;
            padding: 6px 12px;
            border: none;
            border-radius: 4px;
        }

        .btn-save { background: #007bff; color: white; }
        .btn-delete { background: #dc3545; color: white; padding: 4px 10px; font-size: 0.85rem; }
        .btn-style { background: #28a745; color: white; margin-top: 10px; }

        .input-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 15px;
            background: #f8fafc;
            padding: 15px;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <h1>المنظومة الرقمية التفاعلية - مدرسة الحلفاوي</h1>

    <!-- لوحة تحكم المسؤول (Admin) -->
    <div class="admin-panel">
        <h3>لوحة تحكم المسؤول (Admin)</h3>
        
        <!-- تغيير لون الخط في باب المتابعة فقط -->
        <div>
            <label>اختر لون خط "باب المتابعة" فقط:</label>
            <input type="color" id="fontColorPicker" value="#333333" style="vertical-align: middle; margin-left: 10px;">
            <button type="button" onclick="changeFollowupColor()" class="btn-style">تطبيق اللون على باب المتابعة</button>
        </div>
    </div>

    <!-- باب المتابعة وتقييم التعلمات (قائمة التلاميذ) -->
    <div class="followup-section" id="followupSection">
        <h3>باب المتابعة وتقييم التعلمات (قائمة التلاميذ)</h3>
        <p style="font-size: 0.9rem; color: #64748b;">سجل بيانات التلاميذ، حدد مستواهم، وتابع تقييماتهم (مع1 إلى مع4) والمعدل الآلي:</p>
        
        <!-- حقول إدخال بيانات التلميذ والتقييمات -->
        <div class="input-group">
            <input type="text" id="st-name" placeholder="اسم التلميذ الثلاثي" style="padding: 8px; border-radius: 6px; flex: 2; min-width: 160px; border: 1px solid #cbd5e1;" required>
            <select id="st-level" style="padding: 8px; border-radius: 6px; border: 1px solid #cbd5e1;">
                <option value="السنة الثالثة">السنة الثالثة</option>
                <option value="السنة الرابعة">السنة الرابعة</option>
            </select>
            <input type="number" id="st-m1" placeholder="مع1" style="width: 60px; padding: 8px; border-radius: 6px; border: 1px solid #cbd5e1;" min="0" max="20" step="0.5">
            <input type="number" id="st-m2" placeholder="مع2" style="width: 60px; padding: 8px; border-radius: 6px; border: 1px solid #cbd5e1;" min="0" max="20" step="0.5">
            <input type="number" id="st-m3" placeholder="مع3" style="width: 60px; padding: 8px; border-radius: 6px; border: 1px solid #cbd5e1;" min="0" max="20" step="0.5">
            <input type="number" id="st-m4" placeholder="مع4" style="width: 60px; padding: 8px; border-radius: 6px; border: 1px solid #cbd5e1;" min="0" max="20" step="0.5">
            <button type="button" onclick="saveStudentData()" class="btn-save">تسجيل وتقييم</button>
        </div>

        <!-- جدول عرض التلاميذ -->
        <table>
            <thead>
                <tr>
                    <th>اسم التلميذ</th>
                    <th>المستوى</th>
                    <th>مع1</th>
                    <th>مع2</th>
                    <th>مع3</th>
                    <th>مع4</th>
                    <th>المعدل العام</th>
                    <th>الحالة التقديرية</th>
                    <th>إجراءات</th>
                </tr>
            </thead>
            <tbody id="gradList"></tbody>
        </table>
    </div>

    <script>
        // دالة حفظ تلميذ جديد مع حساب المعدل آلياً
        function saveStudentData() {
            let name = document.getElementById('st-name').value.trim();
            let level = document.getElementById('st-level').value;
            let m1 = parseFloat(document.getElementById('st-m1').value) || 0;
            let m2 = parseFloat(document.getElementById('st-m2').value) || 0;
            let m3 = parseFloat(document.getElementById('st-m3').value) || 0;
            let m4 = parseFloat(document.getElementById('st-m4').value) || 0;
            
            if(!name) {
                alert('الرجاء إدخال اسم التلميذ');
                return;
            }

            let avg = ((m1 + m2 + m3 + m4) / 4).toFixed(2);
            let status = avg >= 10 ? 'متلئم / موفق' : 'يحتاج دعم';

            let grads = JSON.parse(localStorage.getItem('grads') || '[]');
            grads.push({name, level, m1, m2, m3, m4, avg, status});
            localStorage.setItem('grads', JSON.stringify(grads));
            
            loadGrads();
            
            // تفريغ الحقول بعد التسجيل
            document.getElementById('st-name').value = '';
            document.getElementById('st-m1').value = '';
            document.getElementById('st-m2').value = '';
            document.getElementById('st-m3').value = '';
            document.getElementById('st-m4').value = '';
        }

        // دالة حذف تلميذ
        function deleteStudent(index) {
            let grads = JSON.parse(localStorage.getItem('grads') || '[]');
            grads.splice(index, 1);
            localStorage.setItem('grads', JSON.stringify(grads));
            loadGrads();
        }

        // دالة عرض التلاميذ في الجدول
        function loadGrads() {
            let grads = JSON.parse(localStorage.getItem('grads') || '[]');
            let list = document.getElementById('gradList');
            list.innerHTML = '';
            
            grads.forEach((g, index) => {
                let tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><strong>${g.name}</strong></td>
                    <td>${g.level}</td>
                    <td>${g.m1}</td>
                    <td>${g.m2}</td>
                    <td>${g.m3}</td>
                    <td>${g.m4}</td>
                    <td><strong>${g.avg}</strong></td>
                    <td><span style="padding: 3px 8px; border-radius: 4px; background: ${g.avg >= 10 ? '#d1e7dd' : '#f8d7da'}; color: ${g.avg >= 10 ? '#0f5132' : '#842029'};">${g.status}</span></td>
                    <td><button class="btn-delete" onclick="deleteStudent(${index})">حذف</button></td>
                `;
                list.appendChild(tr);
            });
        }

        // تغيير لون خط باب المتابعة فقط وحفظه
        function changeFollowupColor() {
            let color = document.getElementById('fontColorPicker').value;
            document.getElementById('followupSection').style.color = color;
            localStorage.setItem('followupFontColor', color);
        }

        window.onload = function() {
            loadGrads();
            // استرجاع لون باب المتابعة المحفوظ مسبقاً إن وجد
            let savedColor = localStorage.getItem('followupFontColor');
            if(savedColor) {
                document.getElementById('followupSection').style.color = savedColor;
                document.getElementById('fontColorPicker').value = savedColor;
            }
        };
    </script>
</body>
</html>
